services:
  mysql:
    image: mysql:8.4
    container_name: contentpublishing-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: contentuser
      MYSQL_PASSWORD: contentpass

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: